<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opskrifter</title>
<meta name="theme-color" content="#321134">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Opskrifter">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#321134; --on-brand:#ffffff; --fill:#321134;
  --bg:#f5eff4; --surface:#ffffff; --ink:#24101f; --muted:#7b6579;
  --line:#e7dce5; --tint:#efe4ee; --tint-ink:#321134;
  --done:#a08f9e; --ok:#2f7a4f;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fill:#743a7b;
    --bg:#140913; --surface:#211220; --ink:#f3e9f2; --muted:#ad97ab;
    --line:#3a2539; --tint:#2e1a2e; --tint-ink:#e6c9e8;
    --done:#7c6a7a; --ok:#7fd6a2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fill:#743a7b;
  --bg:#140913; --surface:#211220; --ink:#f3e9f2; --muted:#ad97ab;
  --line:#3a2539; --tint:#2e1a2e; --tint-ink:#e6c9e8;
  --done:#7c6a7a; --ok:#7fd6a2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.3; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body.cook{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #b98bbd; outline-offset:2px}
.hidden{display:none !important}

/* header */
header.top{
  background:var(--brand); color:var(--on-brand); flex:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;
  border-radius:0 0 16px 16px;
}
.top-row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.top h1{font-size:1.45rem;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;overflow-wrap:anywhere}
body.cook .top h1{font-size:1.2rem}
.top .sub{max-width:720px;margin:3px auto 0;opacity:.75;font-size:.8rem}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:0;background:rgba(255,255,255,.1);
  color:var(--on-brand);display:grid;place-items:center;flex:none;text-decoration:none;
}
.icon-btn[aria-pressed="true"]{background:#fff;color:var(--brand)}
.icon-btn svg{width:18px;height:18px}

/* home */
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
.search{width:100%;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:16px}
.search:focus{border-color:var(--fill);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:32px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
.section{margin-top:12px}
.section h2{font-size:.75rem;font-weight:600;color:var(--muted);margin:0 0 5px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:9px 12px;min-height:48px}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;font-weight:600;font-size:.98rem}
.row .m{color:var(--muted);font-size:.8rem;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:.88rem}
.empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* recipe (fits the screen) */
.rec{flex:1;min-height:0;overflow:hidden;width:100%;max-width:980px;margin:0 auto;padding:10px 16px 8px;font-size:calc(15px * var(--s,1))}
.rec.scroll{overflow:auto}
.rec-grid{display:grid;grid-template-columns:1fr;gap:.7em}
@media (min-width:640px){ .rec-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:1.2em} }
.rec h3{font-size:.72em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 .35em;font-weight:700}
.ings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.15em .9em;margin:0;padding:0;list-style:none}
@media (min-width:640px){ .ings{grid-template-columns:1fr} }
.ings li{padding:.12em 0;line-height:1.2;cursor:pointer;overflow-wrap:anywhere}
.ings li.g{grid-column:1/-1;font-weight:700;margin-top:.25em;cursor:default}
.ings .am{font-weight:700;color:var(--tint-ink)}
.ings .x{color:var(--muted)}
.ings li.off{text-decoration:line-through;color:var(--done)}
.ings li.off .am{color:var(--done)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:.55em;padding:.28em 0;line-height:1.28;cursor:pointer;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:1.45em;height:1.45em;border-radius:50%;background:var(--tint);color:var(--tint-ink);font-weight:700;font-size:.85em;display:grid;place-items:center;margin-top:.05em}
.steps li.off{color:var(--done)}
.steps li.off::before{background:var(--fill);color:#fff;content:"✓"}
.rnote{margin:.6em 0 0;color:var(--muted);font-size:.88em}
.cookbar{flex:none;width:100%;max-width:980px;margin:0 auto;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:9px;min-height:44px;font-weight:600;font-size:.92rem;background:var(--fill);color:#fff;padding:0 14px}
.btn.ghost{background:var(--tint);color:var(--tint-ink)}
.btn:disabled{opacity:.45}
.serv{flex:none;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:44px}
.serv button{width:40px;height:42px;border:0;background:transparent;font-size:1.25rem;font-weight:700;color:var(--tint-ink)}
.serv button:disabled{opacity:.3}
.serv span{min-width:58px;text-align:center;font-weight:600;font-size:.9rem;white-space:nowrap}
.serv span.changed{color:var(--tint-ink)}
.ings .am.scaled{background:var(--tint);border-radius:4px;padding:0 .2em}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,6,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:620px;border-radius:22px 22px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);max-height:88dvh;overflow:auto;
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 4px;font-size:1.05rem;font-weight:700}
.hint{color:var(--muted);font-size:.8rem;margin:2px 0 8px}
.pick{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:7px 2px;min-height:44px}
.pick:first-of-type{border-top:0}
.box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--fill);display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:800}
.pick[aria-checked="true"] .box{background:var(--fill)}
.pick .pn{flex:1;min-width:0}
.pick .pq{color:var(--muted);font-size:.82rem;white-space:nowrap}
.pick .on{color:var(--ok);font-size:.75rem;font-weight:600;white-space:nowrap}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.field{width:100%;min-height:42px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-size:16px}

/* toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:50;
  background:#24101f;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2);
  max-width:calc(100% - 32px);font-size:.85rem;
}
.gate{max-width:420px;margin:0 auto;padding:40px 20px}
.gate h2{font-size:1.6rem;margin:0 0 8px}
.gate p{color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="icon-btn hidden" id="backBtn" aria-label="Tilbage" title="Tilbage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Opskrifter</h1>
    <button class="icon-btn hidden" id="wakeBtn" aria-pressed="false" aria-label="Hold skærmen tændt" title="Hold skærmen tændt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="icon-btn" id="cartLink" href="../indkob/" aria-label="Åbn indkøbslisten" title="Åbn indkøbslisten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L20.5 8H6.2"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
    </a>
  </div>
  <div class="sub" id="sub">Henter opskrifter…</div>
</header>

<main id="home">
  <input class="search" id="q" type="search" placeholder="Søg i opskrifter eller ingredienser" autocomplete="off" aria-label="Søg">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>

<div class="rec hidden" id="rec"></div>
<div class="cookbar hidden" id="cookbar">
  <div class="serv hidden" id="serv">
    <button id="servMinus" aria-label="Færre portioner">−</button>
    <span id="servLabel" aria-live="polite"></span>
    <button id="servPlus" aria-label="Flere portioner">+</button>
  </div>
  <button class="btn" id="shopBtn">Tilføj til indkøb</button>
</div>

<div class="gate hidden" id="gate">
  <h2>Åbn jeres link</h2>
  <p>Opskrifterne åbnes via det delte link, som slutter med et # og en kode. Indsæt linket her, hvis siden er åbnet uden.</p>
  <input class="field" id="gateInput" placeholder="Indsæt link eller kode" autocomplete="off">
  <div class="sheet-actions"><button class="btn" id="gateBtn">Åbn opskrifterne</button></div>
  <p class="hint" id="gateMsg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(() => {
const SB_URL = "https://jmkicrzqmzbetzzjoqtd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impta2ljcnpxbXpiZXR6empvcXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzY1NDUsImV4cCI6MjEwODExMjU0NX0.BHSSKBFBVZ0qESq-LFkUccpCFRsbhq50DQi4bxK6jx4";
const CAT_ORDER = ["Aftensmad","Frokost","Morgenmad","Supper","Salater","Tilbehør","Brød","Bagværk","Desserter","Drikke","Andet"];
const SECRET_RE = /^[A-Za-z0-9_-]{16,}$/;

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const keyOf = s => (s || "").trim().replace(/\s+/g, " ").toLowerCase();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* ---------- secret ---------- */
function readSecret(){
  const fromHash = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
  if (SECRET_RE.test(fromHash)) { store.set("opskrifter-secret", fromHash); return fromHash; }
  const saved = store.get("opskrifter-secret");
  if (saved) { history.replaceState(history.state, "", "#" + saved); return saved; }
  return null;
}
const SECRET = readSecret();

/* ---------- state ---------- */
let sb = null, recipes = [], cat = "Alle", current = null;

async function load(){
  try {
    const { data, error } = await sb.rpc("opskrifter_state", { p_secret: SECRET });
    if (error) throw error;
    recipes = data || [];
    renderHome();
    if (current){ const r = recipes.find(x => x.id === current.id); if (r){ current = r; renderRecipe(); } }
    else openFromState();
  } catch(e){
    if (String(e.message || "").includes("Ugyldigt link")) showGate("Linket virker ikke. Tjek, at hele koden er med.");
    else $("sub").textContent = "Kunne ikke hente opskrifterne. Tjek forbindelsen.";
  }
}

/* ---------- home ---------- */
function catsPresent(){
  const set = new Set(recipes.map(r => r.kategori || "Andet"));
  const known = CAT_ORDER.filter(c => set.has(c));
  const extra = [...set].filter(c => !CAT_ORDER.includes(c)).sort((a,b) => a.localeCompare(b, "da"));
  const andet = known.indexOf("Andet");
  if (andet >= 0) known.splice(andet, 1);
  return [...known, ...extra, ...(set.has("Andet") ? ["Andet"] : [])];
}
function meta(r){ return [r.tid, r.portioner].filter(Boolean).join(" · "); }
function matches(r, q){
  if (!q) return true;
  if (keyOf(r.titel).includes(q)) return true;
  return (r.ingredienser || []).some(i => i.n && keyOf(i.n).includes(q));
}
function renderHome(){
  const n = recipes.length;
  $("sub").textContent = n === 0 ? "Ingen opskrifter endnu" : n === 1 ? "1 opskrift" : n + " opskrifter";
  const cats = catsPresent();
  if (cat !== "Alle" && !cats.includes(cat)) cat = "Alle";
  const chips = $("chips"); chips.textContent = "";
  chips.classList.toggle("hidden", cats.length < 2);
  ["Alle", ...cats].forEach(c => chips.append(h("button", { class: "chip", "aria-pressed": c === cat ? "true" : "false", onclick: () => { cat = c; renderHome(); } }, c)));

  const q = keyOf($("q").value);
  const list = $("list"); list.textContent = "";
  const shown = recipes.filter(r => (cat === "Alle" || (r.kategori || "Andet") === cat) && matches(r, q));
  if (!n){
    list.append(h("div", { class: "empty" }, h("strong", null, "Ingen opskrifter endnu"), "Send et billede af en opskrift til Claude, så dukker den op her."));
    return;
  }
  if (!shown.length){ list.append(h("div", { class: "empty" }, h("strong", null, "Ingen fund"), "Prøv et andet ord eller en anden kategori.")); return; }
  const groups = cat === "Alle" && !q ? cats : [null];
  for (const g of groups){
    const rows = shown.filter(r => g === null || (r.kategori || "Andet") === g);
    if (!rows.length) continue;
    list.append(h("section", { class: "section" },
      g ? h("h2", null, g + " (" + rows.length + ")") : null,
      h("div", { class: "card" }, rows.map(r => h("button", { class: "row", onclick: () => openRecipe(r, true) },
        h("span", { class: "t" }, r.titel), meta(r) ? h("span", { class: "m" }, meta(r)) : null)))));
  }
}
$("q").addEventListener("input", renderHome);

/* ---------- recipe ---------- */
/* ---------- portioner & omregning ---------- */
const FRAC = { "½":.5, "¼":.25, "¾":.75, "⅓":1/3, "⅔":2/3, "⅛":.125 };
const NUM = "(\\d+(?:[.,]\\d+)?)?\\s*([½¼¾⅓⅔⅛])?";
const AMT_RE = new RegExp("^\\s*" + NUM + "(?:\\s*[-–]\\s*" + NUM + ")?\\s*(.*)$");
function toNum(i, f){
  if (!i && !f) return null;
  return (i ? parseFloat(i.replace(",", ".")) : 0) + (f ? FRAC[f] : 0);
}
// "2½ dl" -> {a:2.5, b:null, unit:"dl"}, "1-2 fed" -> {a:1, b:2, unit:"fed"}
function parseAmt(m){
  if (!m) return null;
  const s = String(m).replace(/(\d+)\s*\/\s*(\d+)/, (x, p, q) => String(parseInt(p, 10) / parseInt(q, 10)));
  const r = s.match(AMT_RE);
  if (!r) return null;
  const a = toNum(r[1], r[2]); if (a == null) return null;
  return { a, b: toNum(r[3], r[4]), unit: (r[5] || "").trim() };
}
function dec(v, d){ return String(Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).replace(".", ","); }
function quarter(v){
  const q = Math.max(.25, Math.round(v * 4) / 4);
  const w = Math.floor(q), f = q - w;
  const g = f === .25 ? "¼" : f === .5 ? "½" : f === .75 ? "¾" : "";
  return (w ? String(w) : "") + g;
}
function fmt(v, unit){
  const u = unit.toLowerCase().split(/\s+/)[0] || "";
  if (u === "g" || u === "gr" || u === "ml"){
    if (v >= 1000) return { t: dec(v / 1000, 1), unit: u === "ml" ? "l" + unit.slice(u.length) : "kg" + unit.slice(u.length) };
    const r = v < 10 ? Math.round(v * 2) / 2 : v < 100 ? Math.round(v / 5) * 5 : Math.round(v / 10) * 10;
    return { t: dec(Math.max(r, .5), 1), unit };
  }
  if (["dl","l","kg","cl"].includes(u)) return { t: dec(v, 1), unit };
  if (["tsk","spsk","knsp","knivspids","nip","kop","kopper"].includes(u)) return { t: quarter(v), unit };
  if (u === "fed") return { t: String(Math.max(1, Math.round(v))), unit };
  // stk, ds, uden enhed: halve
  const hv = Math.max(.5, Math.round(v * 2) / 2);
  return { t: quarter(hv), unit };
}
function scaleAmt(m, k){
  if (!m || k === 1) return m || "";
  const p = parseAmt(m); if (!p) return m;
  const A = fmt(p.a * k, p.unit);
  if (p.b == null) return (A.t + " " + A.unit).trim();
  const B = fmt(p.b * k, p.unit);
  return (A.t + "-" + B.t + " " + B.unit).trim();
}
// "4 pers" -> {n:4, label:"pers"}
function parseServ(s){
  const r = (s || "").match(/^\s*(\d+)\s*(.*)$/);
  return r ? { n: parseInt(r[1], 10), label: r[2].trim() } : null;
}
let base = null, serv = null;
const factor = () => (base && serv) ? serv / base.n : 1;
function renderServ(){
  const box = $("serv");
  box.classList.toggle("hidden", !base);
  if (!base) return;
  const l = $("servLabel");
  l.textContent = serv + (base.label ? " " + base.label : "");
  l.classList.toggle("changed", serv !== base.n);
  $("servMinus").disabled = serv <= 1;
}
function setServ(n){
  serv = Math.max(1, Math.min(99, n));
  renderRecipe();
}
$("servMinus").addEventListener("click", () => setServ(serv - 1));
$("servPlus").addEventListener("click", () => setServ(serv + 1));

let offIng = new Set(), offStep = new Set();
function openRecipe(r, push){
  current = r; offIng = new Set(); offStep = new Set();
  base = parseServ(r.portioner); serv = base ? base.n : null;
  if (push) history.pushState({ id: r.id }, "", location.hash || "");
  document.body.classList.add("cook");
  $("home").classList.add("hidden");
  $("rec").classList.remove("hidden"); $("cookbar").classList.remove("hidden");
  $("backBtn").classList.remove("hidden");
  renderRecipe();
}
function closeRecipe(){
  current = null;
  document.body.classList.remove("cook");
  $("home").classList.remove("hidden");
  $("rec").classList.add("hidden"); $("cookbar").classList.add("hidden");
  $("backBtn").classList.add("hidden");
  $("title").textContent = "Opskrifter";
  renderHome();
  window.scrollTo(0, 0);
}
function openFromState(){
  const id = history.state && history.state.id;
  const r = id && recipes.find(x => x.id === id);
  if (r) openRecipe(r, false);
}
$("backBtn").addEventListener("click", () => { if (history.state && history.state.id) history.back(); else closeRecipe(); });
window.addEventListener("popstate", () => {
  const id = history.state && history.state.id;
  const r = id && recipes.find(x => x.id === id);
  if (r) openRecipe(r, false); else closeRecipe();
});

function ingLine(i, idx){
  if (i.g) return h("li", { class: "g" }, i.g);
  return h("li", { class: offIng.has(idx) ? "off" : null, onclick: ev => { toggleSet(offIng, idx); ev.currentTarget.classList.toggle("off"); } },
    i.m ? h("span", { class: "am" + (factor() !== 1 && parseAmt(i.m) ? " scaled" : "") }, scaleAmt(i.m, factor())) : null,
    i.m ? " " : null, i.n, i.x ? h("span", { class: "x" }, ", " + i.x) : null);
}
function renderRecipe(){
  const r = current; if (!r) return;
  $("title").textContent = r.titel;
  $("sub").textContent = [r.kategori, r.tid, base ? null : r.portioner].filter(Boolean).join(" · ");
  renderServ();
  const box = $("rec"); box.textContent = "";
  const ings = r.ingredienser || [], steps = r.trin || [];
  box.append(h("div", { class: "rec-grid" },
    ings.length ? h("section", null, h("h3", null, "Ingredienser"), h("ul", { class: "ings" }, ings.map(ingLine))) : null,
    steps.length ? h("section", null, h("h3", null, "Sådan gør du"), h("ol", { class: "steps" }, steps.map((s, idx) =>
      h("li", { class: offStep.has(idx) ? "off" : null, onclick: ev => { toggleSet(offStep, idx); ev.currentTarget.classList.toggle("off"); } }, s))),
      r.note ? h("p", { class: "rnote" }, r.note) : null) : null
  ));
  $("shopBtn").disabled = !ings.some(i => i.n);
  fit();
}
function toggleSet(set, v){ set.has(v) ? set.delete(v) : set.add(v); }
// skrumper teksten trinvist, indtil hele opskriften passer på skærmen uden scroll
function fit(){
  const box = $("rec");
  if (box.classList.contains("hidden")) return;
  box.classList.remove("scroll");
  let s = 1.12;
  box.style.setProperty("--s", s);
  while (box.scrollHeight > box.clientHeight + 1 && s > 0.7){
    s = Math.round((s - 0.03) * 100) / 100;
    box.style.setProperty("--s", s);
  }
  if (box.scrollHeight > box.clientHeight + 1) box.classList.add("scroll");
}
let fitTimer = null;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

/* ---------- sheets & toast ---------- */
function sheet(build){
  const scrim = h("div", { class: "scrim", onclick: ev => { if (ev.target === scrim) close(); } });
  const box = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" });
  const close = () => { scrim.remove(); document.removeEventListener("keydown", esc); };
  const esc = ev => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", esc);
  build(box, close);
  scrim.append(box); document.body.append(scrim);
  return close;
}
let toastEl = null, toastTimer = null;
function toast(msg){
  if (toastEl) toastEl.remove(); clearTimeout(toastTimer);
  toastEl = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(toastEl);
  toastTimer = setTimeout(() => { if (toastEl){ toastEl.remove(); toastEl = null; } }, 3500);
}

/* ---------- indkøb ---------- */
// Samme kategori-gæt som indkøbsappen, så varerne lander samme sted som når de skrives ind manuelt
const KEYWORDS = [
  ["Frost", ["frost","frossen","frosne","is","ispinde","pommes"]],
  ["Baby", ["ble","bleer","baby","vatrondel","vatpind","vådservietter","modermælk"]],
  ["Husholdning", ["toiletpapir","køkkenrulle","opvask","sæbe","affaldspose","skraldepose","rengøring","vaskepulver","vaskemiddel","skyllemiddel","alufolie","bagepapir","fryseposer","husholdningsfilm","batterier","tandpasta","tandbørste","shampoo","balsam","deodorant","plaster","servietter","stearinlys"]],
  ["Kolonial", ["dåse","konserves","chips","pesto","sovs","sauce"]],
  ["Frugt & grønt", ["æble","banan","pære","appelsin","citron","lime","tomat","agurk","salat","løg","hvidløg","kartof","gulerød","gulerødder","peberfrugt","squash","broccoli","kål","spinat","avocado","melon","drue","bær","svampe","champignon","selleri","porre","ingefær","persille","basilikum","dild","koriander","mango","ananas","kiwi","dadler","rødbede","aubergine","blomkål","radiser","clementin","mandarin","blommer","fersken","nektarin"]],
  ["Mejeri & køl", ["mælk","ost","yoghurt","skyr","fløde","smør","æg","creme fraiche","cremefraiche","feta","halloumi","mozzarella","parmesan","kvark","hummus","margarine","cheddar","mascarpone","ricotta"]],
  ["Kød & fisk", ["kød","fars","kylling","laks","fisk","bacon","skinke","pølse","pølser","pålæg","rejer","torsk","tun","frikadelle","frikadeller","bøf","bøffer","burger","medister","leverpostej","salami","kalkun","mørbrad","flæsk"]],
  ["Brød", ["brød","boller","bolle","toast","tortilla","tortillas","pita","baguette","knækbrød","rundstykker","croissant","wraps"]],
  ["Bagning & krydderier", ["mel","gær","sukker","bagepulver","vanilje","kanel","krydderi","krydderimix","peber","salt","spidskommen","gurkemeje","paprika","karry","oregano","timian","chokolade","honning","natron","bouillon"]],
  ["Drikkevarer", ["sodavand","cola","juice","saft","vand","øl","vin","kaffe","te","kakao","danskvand","smoothie"]],
  ["Kolonial", ["pasta","ris","nudler","müsli","musli","havregryn","cornflakes","marmelade","nutella","peanuts","nødder","mandler","nachos","olie","eddike","ketchup","sennep","mayo","tyggegummi","slik","kiks","baked beans","linser","kikærter","couscous","bulgur","quinoa","popcorn","rosiner","majs","bønner"]]
];
function wordHit(k, words, w){
  if (w.includes(" ")) return k.includes(w);
  if (w.length <= 2) return words.includes(w);
  if (w.length <= 4) return words.some(x => x.startsWith(w) || x.endsWith(w));
  return k.includes(w);
}
function guessCat(name, st){
  const k = keyOf(name); if (!k) return null;
  const byId = id => st.categories.find(c => c.id === id);
  const exact = st.memory.find(m => m.key === k);
  if (exact && byId(exact.category_id)) return exact.category_id;
  const pref = st.memory.find(m => m.key.length >= 3 && (k.startsWith(m.key + " ") || m.key.startsWith(k + " ")) && byId(m.category_id));
  if (pref) return pref.category_id;
  const words = k.split(" ");
  for (const [cname, list] of KEYWORDS){
    if (list.some(w => wordHit(k, words, w))) {
      const c = st.categories.find(c => c.name.toLowerCase() === cname.toLowerCase());
      if (c) return c.id;
    }
  }
  return null;
}
function indkobSecret(){ const s = store.get("indkob-secret"); return s && SECRET_RE.test(s) ? s : null; }
async function indkobRpc(fn, args){
  const { data, error } = await sb.rpc(fn, Object.assign({ p_secret: indkobSecret() }, args || {}));
  if (error) throw error;
  return data;
}
async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
// fortæller indkøbsappen på de andre telefoner, at listen er ændret
async function pingIndkob(){
  try {
    const ch = sb.channel("indkob-" + (await sha(indkobSecret())).slice(0, 24), { config: { broadcast: { self: false } } });
    await new Promise(res => { const t = setTimeout(res, 3000); ch.subscribe(s => { if (s === "SUBSCRIBED"){ clearTimeout(t); res(); } }); });
    await ch.send({ type: "broadcast", event: "changed", payload: { by: store.get("indkob-me") } });
    setTimeout(() => sb.removeChannel(ch), 1500);
  } catch(e){}
}
function askIndkobLink(then){
  sheet((box, close) => {
    const inp = h("input", { class: "field", placeholder: "Indsæt indkøbslinket", autocomplete: "off" });
    const msg = h("p", { class: "hint" });
    box.append(h("h3", null, "Forbind til indkøbslisten"),
      h("p", { class: "hint" }, "Indsæt linket til jeres indkøbsliste (det, der slutter med # og en kode). Det skal kun gøres én gang på denne telefon."),
      inp, msg,
      h("div", { class: "sheet-actions" },
        h("button", { class: "btn ghost", type: "button", onclick: close }, "Annullér"),
        h("button", { class: "btn", type: "button", onclick: () => {
          const v = inp.value.trim(); const code = v.includes("#") ? v.split("#").pop() : v;
          if (!SECRET_RE.test(code)) { msg.textContent = "Det ligner ikke et gyldigt link."; return; }
          store.set("indkob-secret", code); close(); then();
        } }, "Gem")));
  });
}
async function openShop(){
  if (!current) return;
  if (!indkobSecret()) { askIndkobLink(openShop); return; }
  let st;
  try { st = await indkobRpc("indkob_state"); }
  catch(e){
    if (String(e.message || "").includes("Ugyldigt link")) { store.set("indkob-secret", ""); askIndkobLink(openShop); }
    else toast("Kunne ikke hente indkøbslisten. Tjek forbindelsen.");
    return;
  }
  const onList = new Set((st.items || []).filter(i => !i.checked).map(i => keyOf(i.name)));
  const seen = new Set();
  const rows = (current.ingredienser || []).filter(i => i.n).filter(i => { const k = keyOf(i.n); if (seen.has(k)) return false; seen.add(k); return true; })
    .map(i => ({ name: cap(i.n.trim()), qty: scaleAmt(i.m, factor()), on: onList.has(keyOf(i.n)), pick: false }));
  sheet((box, close) => {
    const listEl = h("div");
    const go = h("button", { class: "btn", type: "button" });
    const draw = () => {
      listEl.textContent = "";
      rows.forEach(r => listEl.append(h("button", { class: "pick", type: "button", role: "checkbox", "aria-checked": r.pick ? "true" : "false",
        onclick: () => { r.pick = !r.pick; draw(); } },
        h("span", { class: "box" }, r.pick ? "✓" : ""), h("span", { class: "pn" }, r.name),
        r.on ? h("span", { class: "on" }, "på listen") : (r.qty ? h("span", { class: "pq" }, r.qty) : null))));
      const n = rows.filter(r => r.pick).length;
      go.disabled = n === 0;
      go.textContent = n === 0 ? "Vælg varer" : n === 1 ? "Tilføj 1 vare" : "Tilføj " + n + " varer";
    };
    go.addEventListener("click", async () => {
      const picked = rows.filter(r => r.pick); if (!picked.length) return;
      go.disabled = true; go.textContent = "Tilføjer…";
      const me = store.get("indkob-me") || null;
      let ok = 0;
      for (const r of picked){
        try {
          await indkobRpc("indkob_add", { p_name: r.name, p_qty: r.qty || null, p_note: "til " + current.titel, p_category: guessCat(r.name, st), p_by: me });
          ok++;
        } catch(e){}
      }
      close();
      if (ok) pingIndkob();
      toast(ok === picked.length ? (ok === 1 ? "1 vare tilføjet til indkøb" : ok + " varer tilføjet til indkøb") : "Kun " + ok + " af " + picked.length + " blev tilføjet. Prøv igen.");
    });
    draw();
    box.append(h("h3", null, "Hvad mangler du?"),
      h("p", { class: "hint" }, "Sæt flueben ved det, der skal på indkøbslisten." + (base ? " Mængder til " + serv + (base.label ? " " + base.label : "") + "." : "")),
      listEl,
      h("div", { class: "sheet-actions" }, h("button", { class: "btn ghost", type: "button", onclick: close }, "Luk"), go));
  });
}
$("shopBtn").addEventListener("click", openShop);
$("cartLink").addEventListener("click", ev => {
  const s = indkobSecret();
  if (s) $("cartLink").href = "../indkob/#" + s;
});

/* ---------- wake lock ---------- */
let wakeLock = null, wantWake = store.get("opskrifter-wake") === "1";
async function applyWake(){
  const b = $("wakeBtn");
  if (wantWake && document.visibilityState === "visible"){
    try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    catch(e){ wantWake = false; toast("Skærmen kan ikke holdes tændt her."); }
  } else if (!wantWake && wakeLock){ try { await wakeLock.release(); } catch(e){} wakeLock = null; }
  b.setAttribute("aria-pressed", wantWake ? "true" : "false");
  b.title = wantWake ? "Skærmen holdes tændt" : "Hold skærmen tændt";
}
if ("wakeLock" in navigator){
  $("wakeBtn").classList.remove("hidden");
  $("wakeBtn").addEventListener("click", () => {
    wantWake = !wantWake; store.set("opskrifter-wake", wantWake ? "1" : "0");
    toast(wantWake ? "Skærmen holdes tændt, mens appen er åben" : "Skærmen må gå i dvale igen");
    applyWake();
  });
}

/* ---------- gate & boot ---------- */
function showGate(msg){
  $("home").classList.add("hidden"); $("rec").classList.add("hidden"); $("cookbar").classList.add("hidden");
  $("gate").classList.remove("hidden"); $("sub").textContent = "";
  if (msg) $("gateMsg").textContent = msg;
}
$("gateBtn").addEventListener("click", () => {
  const v = $("gateInput").value.trim();
  const code = v.includes("#") ? v.split("#").pop() : v;
  if (!SECRET_RE.test(code)) { $("gateMsg").textContent = "Det ligner ikke en gyldig kode."; return; }
  store.set("opskrifter-secret", code); location.hash = code; location.reload();
});

function boot(){
  if (!SECRET) { showGate(); return; }
  if (!window.supabase) { $("sub").textContent = "Kunne ikke indlæse. Tjek forbindelsen og genindlæs."; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  load();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible"){ load(); if (wantWake) applyWake(); }
  });
  if (wantWake) applyWake();
}
boot();
})();
