<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opskrifter</title>
<meta name="theme-color" content="#321134">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Opskrifter">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#321134; --on-brand:#ffffff; --fill:#321134;
  --bg:#f5eff4; --surface:#ffffff; --ink:#24101f; --muted:#7b6579;
  --line:#e7dce5; --tint:#efe4ee; --tint-ink:#321134;
  --done:#a08f9e; --ok:#2f7a4f; --star:#c98a12; --alert:#a3253a;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fill:#743a7b;
    --bg:#140913; --surface:#211220; --ink:#f3e9f2; --muted:#ad97ab;
    --line:#3a2539; --tint:#2e1a2e; --tint-ink:#e6c9e8;
    --done:#7c6a7a; --ok:#7fd6a2; --star:#f0b93a; --alert:#e2566d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fill:#743a7b;
  --bg:#140913; --surface:#211220; --ink:#f3e9f2; --muted:#ad97ab;
  --line:#3a2539; --tint:#2e1a2e; --tint-ink:#e6c9e8;
  --done:#7c6a7a; --ok:#7fd6a2; --star:#f0b93a; --alert:#e2566d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;touch-action:manipulation}
*{touch-action:manipulation}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.3; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body.cook{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #b98bbd; outline-offset:2px}
.hidden{display:none !important}

/* header */
header.top{
  background:var(--brand); color:var(--on-brand); flex:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;
  border-radius:0 0 16px 16px;
}
.top-row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px}
.top h1{font-size:1.45rem;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;overflow-wrap:anywhere}
body.cook .top h1{font-size:1.2rem}
.top .sub{max-width:720px;margin:3px auto 0;opacity:.75;font-size:.8rem}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:0;background:rgba(255,255,255,.1);
  color:var(--on-brand);display:grid;place-items:center;flex:none;text-decoration:none;
}
.icon-btn[aria-pressed="true"]{background:#fff;color:var(--brand)}
#favBtn[aria-pressed="true"]{background:rgba(255,255,255,.1);color:#f0b93a}
#favBtn[aria-pressed="true"] svg{fill:currentColor}
.icon-btn svg{width:18px;height:18px}

/* home */
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
.search-row{display:flex;gap:8px}
.search{flex:1;min-width:0;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:16px}
.search:focus,.sort:focus{border-color:var(--fill);outline:none}
.sort{flex:none;max-width:42%;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:32px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
.section{margin-top:12px}
.section h2{font-size:.75rem;font-weight:600;color:var(--muted);margin:0 0 5px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:9px 12px;min-height:48px}
.card > :first-child{border-top:0}
.row .tw{flex:1;min-width:0}
.row .t{display:block;font-weight:600;font-size:.98rem}
.row .t2{display:block;color:var(--muted);font-size:.76rem;margin-top:1px}
.row .m{color:var(--muted);font-size:.8rem;white-space:nowrap}
.star{color:var(--star)}
.plan-row{display:flex;align-items:center;border-top:1px solid var(--line)}
.plan-row .row{border-top:0;flex:1;min-width:0}
.x-btn{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1}
.plan-actions{display:flex;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.plan-actions .btn{min-height:40px;font-size:.88rem}
.home-foot{display:flex;gap:8px;margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:.88rem}
.empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* recipe (fits the screen) */
.rec{flex:1;min-height:0;overflow:hidden;width:100%;max-width:980px;margin:0 auto;padding:10px 16px 8px;font-size:calc(15px * var(--s,1))}
.rec.scroll{overflow:auto}
.rec-grid{display:grid;grid-template-columns:1fr;gap:.7em}
@media (min-width:640px){ .rec-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:1.2em} }
.rec h3{font-size:.72em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 .35em;font-weight:700}
.ings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.15em .9em;margin:0;padding:0;list-style:none}
@media (min-width:640px){ .ings{grid-template-columns:1fr} }
.ings li{padding:.12em 0;line-height:1.2;cursor:pointer;overflow-wrap:anywhere}
.ings li.g{grid-column:1/-1;font-weight:700;margin-top:.25em;cursor:default}
.ings .am{font-weight:700;color:var(--tint-ink)}
.ings .x{color:var(--muted)}
.ings li.off{text-decoration:line-through;color:var(--done)}
.ings li.off .am{color:var(--done)}
.ings .am.scaled{background:var(--tint);border-radius:4px;padding:0 .2em}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:.55em;padding:.28em 0;line-height:1.28;cursor:pointer;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:1.45em;height:1.45em;border-radius:50%;background:var(--tint);color:var(--tint-ink);font-weight:700;font-size:.85em;display:grid;place-items:center;margin-top:.05em}
.steps li.off{color:var(--done)}
.steps li.off::before{background:var(--fill);color:#fff;content:"✓"}
.tm{border:0;background:var(--tint);color:var(--tint-ink);font-weight:700;border-radius:6px;padding:0 .3em;margin:0 .05em;font-size:inherit;line-height:inherit;display:inline-flex;align-items:center;gap:.2em}
.tm svg{width:.85em;height:.85em}
.notes{margin-top:.7em}
.notes-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:.25em}
.notes-head h3{margin:0}
.add-note{border:0;background:transparent;color:var(--tint-ink);font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.2em 0 .2em .6em;min-height:32px}
.notes ul{list-style:none;margin:0;padding:0}
.notes li button{display:flex;gap:.55em;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:.28em 0;font-size:1em;line-height:1.28;white-space:pre-wrap;overflow-wrap:anywhere;color:inherit}
.notes li:first-child button{border-top:0}
.cookbar{flex:none;width:100%;max-width:980px;margin:0 auto;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:9px;min-height:44px;font-weight:600;font-size:.92rem;background:var(--fill);color:#fff;padding:0 14px}
.btn.ghost{background:var(--tint);color:var(--tint-ink)}
.btn.danger{background:var(--alert);color:#fff}
.btn:disabled{opacity:.45}
.serv{flex:none;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:44px}
.serv button{width:40px;height:42px;border:0;background:transparent;font-size:1.25rem;font-weight:700;color:var(--tint-ink)}
.serv button:disabled{opacity:.3}
.serv span{min-width:58px;text-align:center;font-weight:600;font-size:.9rem;white-space:nowrap}
.serv span.changed{color:var(--tint-ink)}

/* timers */
.timers{flex:none;width:100%;max-width:980px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:6px}
.timers:empty{display:none}
body:not(.cook) .timers{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30;max-width:720px}
body.cook .timers{padding-top:6px}
.timer{display:flex;align-items:center;gap:10px;background:var(--brand);color:#fff;border-radius:12px;padding:0 0 0 12px;min-height:46px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.timer .tl{flex:1;min-width:0;font-size:.82rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tt{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.timer .tx{width:46px;height:46px;border:0;background:transparent;color:#fff;font-size:1.3rem}
.timer.done{background:var(--alert);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.75}}
@media (prefers-reduced-motion: reduce){.timer.done{animation:none}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,6,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:620px;border-radius:22px 22px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);max-height:90dvh;overflow:auto;
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 4px;font-size:1.05rem;font-weight:700}
.sheet h4{margin:14px 0 2px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hint{color:var(--muted);font-size:.8rem;margin:2px 0 8px}
.pick{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:7px 2px;min-height:44px}
.pick-list > .pick:first-child{border-top:0}
.box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--fill);display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:800}
.pick[aria-checked="true"] .box{background:var(--fill)}
.pick .pn{flex:1;min-width:0}
.pick .pn small{display:block;color:var(--muted);font-size:.72rem}
.pick .pq{color:var(--muted);font-size:.82rem;white-space:nowrap;text-align:right}
.pick .on{color:var(--ok);font-size:.75rem;font-weight:600;white-space:nowrap}
.pick.basis .pn{color:var(--muted)}
.link-btn{border:0;background:transparent;color:var(--tint-ink);font-weight:600;font-size:.85rem;padding:8px 2px;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.sheet-actions{display:flex;gap:8px;margin-top:12px;position:sticky;z-index:1;background:var(--surface);
  bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 14px));padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 14px);margin-bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 14px))}
.field{width:100%;min-height:42px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-size:16px}
textarea.field{min-height:110px;resize:vertical;line-height:1.35;padding:8px 10px}
select.field{appearance:auto}
.lbl{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin:10px 0 3px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:10px 2px;min-height:50px;font-size:.98rem;font-weight:600;color:var(--ink);text-decoration:none}
.menu-item:first-of-type{border-top:0}
.menu-item svg{width:20px;height:20px;flex:none;color:var(--tint-ink)}
.menu-item small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.hist{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:.88rem;min-height:40px}
.hist:first-of-type{border-top:0}
.basis-add{display:flex;gap:8px;margin-top:10px}
.basis-add .btn{flex:none}
.note-meta{color:var(--muted);font-size:.78rem;margin:4px 0 0}

/* toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:50;
  background:#24101f;color:#fff;border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2);
  max-width:calc(100% - 32px);font-size:.85rem;display:flex;align-items:center;gap:10px;min-height:42px
}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;border-radius:9px;padding:6px 10px;font-size:.82rem;white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="icon-btn hidden" id="backBtn" aria-label="Tilbage" title="Tilbage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Opskrifter</h1>
    <button class="icon-btn hidden" id="favBtn" aria-pressed="false" aria-label="Favorit" title="Favorit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8-4.2-4.1 5.9-.9z"/></svg>
    </button>
    <button class="icon-btn hidden" id="wakeBtn" aria-pressed="false" aria-label="Hold skærmen tændt" title="Hold skærmen tændt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn hidden" id="menuBtn" aria-label="Flere valg" title="Flere valg">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <a class="icon-btn" id="cartLink" href="../indkob/" aria-label="Åbn indkøbslisten" title="Åbn indkøbslisten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L20.5 8H6.2"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>

  </div>
  <div class="sub" id="sub">Henter opskrifter…</div>
</header>

<main id="home">
  <div class="search-row">
    <input class="search" id="q" type="search" placeholder="Søg i opskrifter eller ingredienser" autocomplete="off" aria-label="Søg">
    <select class="sort" id="sort" aria-label="Sortér">
      <option value="kat">Kategorier</option>
      <option value="az">A-Å</option>
      <option value="senest">Senest lavet</option>
      <option value="laengst">Længst siden</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="home-foot">
    <button class="btn ghost" id="newBtn" type="button">+ Ny opskrift</button>
    <button class="btn ghost" id="basisBtn" type="button">Basisvarer</button>
  </div>
</main>

<div class="rec hidden" id="rec"></div>
<div class="timers" id="timers" aria-live="polite"></div>
<div class="cookbar hidden" id="cookbar">
  <div class="serv hidden" id="serv">
    <button id="servMinus" aria-label="Færre portioner">−</button>
    <span id="servLabel" aria-live="polite"></span>
    <button id="servPlus" aria-label="Flere portioner">+</button>
  </div>
  <button class="btn" id="shopBtn">Tilføj til indkøb</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>

(() => {
const SB_URL = "https://jmkicrzqmzbetzzjoqtd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impta2ljcnpxbXpiZXR6empvcXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzY1NDUsImV4cCI6MjEwODExMjU0NX0.BHSSKBFBVZ0qESq-LFkUccpCFRsbhq50DQi4bxK6jx4";

  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',

/* ---------- portioner & omregning ---------- */
const FRAC = { "½":.5, "¼":.25, "¾":.75, "⅓":1/3, "⅔":2/3, "⅛":.125 };
const NUM = "(\\d+(?:[.,]\\d+)?)?\\s*([½¼¾⅓⅔⅛])?";
const AMT_RE = new RegExp("^\\s*" + NUM + "(?:\\s*[-–]\\s*" + NUM + ")?\\s*(.*)$");
function toNum(i, f){
  if (!i && !f) return null;
  return (i ? parseFloat(i.replace(",", ".")) : 0) + (f ? FRAC[f] : 0);
}
// "2½ dl" -> {a:2.5, b:null, unit:"dl"}, "1-2 fed" -> {a:1, b:2, unit:"fed"}
function parseAmt(m){
  if (!m) return null;
  const s = String(m).replace(/(\d+)\s*\/\s*(\d+)/, (x, p, q) => String(parseInt(p, 10) / parseInt(q, 10)));
  const r = s.match(AMT_RE);
  if (!r) return null;
  const a = toNum(r[1], r[2]); if (a == null) return null;
  return { a, b: toNum(r[3], r[4]), unit: (r[5] || "").trim() };
}
function dec(v, d){ return String(Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).replace(".", ","); }
function quarter(v){
  const q = Math.max(.25, Math.round(v * 4) / 4);
  const w = Math.floor(q), f = q - w;
  const g = f === .25 ? "¼" : f === .5 ? "½" : f === .75 ? "¾" : "";
  return (w ? String(w) : "") + g;
}
function fmt(v, unit){
  const u = unit.toLowerCase().split(/\s+/)[0] || "";
  if (u === "g" || u === "gr" || u === "ml"){
    if (v >= 1000) return { t: dec(v / 1000, 1), unit: u === "ml" ? "l" + unit.slice(u.length) : "kg" + unit.slice(u.length) };
    const r = v < 10 ? Math.round(v * 2) / 2 : v < 50 ? Math.round(v) : v < 200 ? Math.round(v / 5) * 5 : Math.round(v / 10) * 10;
    return { t: dec(Math.max(r, .5), 1), unit };
  }
  if (["dl","l","kg","cl"].includes(u)) return { t: dec(v, 1), unit };
  if (["tsk","spsk","knsp","knivspids","nip","kop","kopper"].includes(u)) return { t: quarter(v), unit };
  if (u === "fed") return { t: String(Math.max(1, Math.round(v))), unit };
  // stk, ds, uden enhed: halve
  const hv = Math.max(.5, Math.round(v * 2) / 2);
  return { t: quarter(hv), unit };
}
const fmtStr = (v, unit) => { const f = fmt(v, unit); return (f.t + " " + f.unit).trim(); };
function scaleAmt(m, k){
  if (!m || k === 1) return m || "";
  const p = parseAmt(m); if (!p) return m;
  const A = fmt(p.a * k, p.unit);
  if (p.b == null) return (A.t + " " + A.unit).trim();
  const B = fmt(p.b * k, p.unit);
  return (A.t + "-" + B.t + " " + B.unit).trim();
}
// "4 pers" -> {n:4, label:"pers"}
function parseServ(s){
  const r = (s || "").match(/^\s*(\d+)\s*(.*)$/);
  return r ? { n: parseInt(r[1], 10), label: r[2].trim() } : null;
}
let base = null, serv = null, allowed = [];
const factor = () => (base && serv) ? serv / base.n : 1;
// kun antal portioner hvor ting der tælles i hele stykker (æg, bananer, dåser …) går op
const COUNT_UNITS = ["", "stk", "stk.", "ds", "dåse", "dåser"];
function allowedServings(r, b){
  const counts = (r.ingredienser || []).map(i => parseAmt(i.m))
    .filter(p => p && p.b == null && COUNT_UNITS.includes((p.unit.split(/\s+/)[0] || "").toLowerCase()));
  const ok = [];
  const max = Math.max(b.n, r.maks || 99);
  for (let n = 1; n <= max; n++){
    if (counts.every(p => { const v = p.a * n / b.n; return Math.abs(v - Math.round(v)) < 1e-9 && Math.round(v) >= 1; })) ok.push(n);
  }
  if (!ok.includes(b.n)) ok.push(b.n);
  return ok.sort((x, y) => x - y);
}

function stepServ(dir){

  }
}

// tider i trin bliver til knapper, der starter en timer ("10 min", "45-60 min", "1 time")
const TIME_RE = /(\d+)(?:\s*[-–]\s*(\d+))?\s*(minutter|minut|min|timer|time|t)(?=[\s.,;:)!]|$)/gi;
function stepContent(s, idx){
  const out = []; let last = 0, m;
  TIME_RE.lastIndex = 0;
  while ((m = TIME_RE.exec(s))){
    const mins = parseInt(m[1], 10) * (m[3].toLowerCase().startsWith("t") ? 60 : 1);
    if (mins <= 0 || mins > 24 * 60) continue;
    out.push(s.slice(last, m.index));
    const label = "Trin " + (idx + 1) + " · " + current.titel;
    out.push(h("button", { class: "tm", type: "button", "aria-label": "Start timer på " + mins + " minutter",
      onclick: ev => { ev.stopPropagation(); startTimer(mins, label); } }, svg(ICON.clock), m[0]));
    last = m.index + m[0].length;
  }
  out.push(s.slice(last));
  return out;
}

}

function stopTimer(id){
  timers = timers.filter(t => t.id !== id);
  saveTimers(); renderTimers();
}
function mmss(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return (hh ? hh + ":" + String(mm).padStart(2, "0") : String(mm)) + ":" + String(ss).padStart(2, "0");
}
function renderTimers(){
  const now = Date.now(), box = $("timers");
  let newlyDone = null;
  for (const t of timers) if (!t.done && t.end <= now){ t.done = true; newlyDone = t; }
  if (newlyDone){
    saveTimers();
    toast("Tiden er gået: " + newlyDone.label);
    try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch(e){}
  }
  box.textContent = "";
  timers.forEach(t => box.append(h("div", { class: "timer" + (t.done ? " done" : "") },
    h("span", { class: "tl" }, t.label),
    h("span", { class: "tt" }, t.done ? "Færdig!" : mmss(t.end - now)),
    h("button", { class: "tx", type: "button", "aria-label": t.done ? "Stop alarmen" : "Stop timeren", onclick: () => stopTimer(t.id) }, "×"))));
  const anyDone = timers.some(t => t.done);
  if (anyDone && !beepLoop){ beep(); beepLoop = setInterval(beep, 1600); }
  if (!anyDone && beepLoop){ clearInterval(beepLoop); beepLoop = null; }
  if (timers.length !== lastTimerCount){ lastTimerCount = timers.length; fit(); }
}

const UNIT_RE = "(?:g|gr|kg|ml|cl|dl|l|spsk|tsk|stk\\.?|fed|ds|dåse|dåser|knsp|nip|kop|kopper|bundt|skive|skiver|pakke|pk)";
const AMT_TXT = "(?:\\d+(?:[.,]\\d+)?\\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])(?:\\s*[-–]\\s*(?:\\d+(?:[.,]\\d+)?\\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛]))?";
const LINE_RE = new RegExp("^(" + AMT_TXT + "(?:\\s+" + UNIT_RE + ")?)(?:\\s+|$)(.*)$", "i");
function ingToLine(i){
  if (i.g) return "# " + i.g;
  let s = [i.m, i.n].filter(Boolean).join(" ");
  if (i.x) s += ", " + i.x;
  if (i.alt && i.alt.m) s += " | " + [i.alt.m, i.alt.t].filter(Boolean).join(" ");
  return s;
}
function lineToIng(line){
  line = line.trim(); if (!line) return null;
  if (line.startsWith("#")) { const g = line.replace(/^#+\s*/, "").trim(); return g ? { g } : null; }
  const [main, altPart] = line.split(/\s+\|\s+/);
  const ci = main.indexOf(", ");
  const head = ci >= 0 ? main.slice(0, ci) : main, x = ci >= 0 ? main.slice(ci + 2).trim() : "";
  const o = {};
  const m = head.match(LINE_RE);
  if (m && m[2].trim()){ o.m = m[1].trim(); o.n = m[2].trim(); } else o.n = head.trim();
  if (x) o.x = x;
  if (altPart){
    const a = altPart.trim().match(LINE_RE);
    if (a) o.alt = Object.assign({ m: a[1].trim() }, a[2].trim() ? { t: a[2].trim() } : {});
  }
  return o.n ? o : null;
}
function parseIngs(text){
  const out = [];
  for (const raw of text.split("\n")){
    const line = raw.trim();
    if (/^\|/.test(line) && out.length && !out[out.length - 1].g){
      const tmp = lineToIng("x | " + line.replace(/^\|\s*/, ""));
      if (tmp && tmp.alt){ out[out.length - 1].alt = tmp.alt; continue; }
    }
    const o = lineToIng(line); if (o) out.push(o);
  }
  return out;
}

function sheet(build){
  const scrim = h("div", { class: "scrim", onclick: ev => { if (ev.target === scrim) close(); } });
  const box = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" });
  const close = () => { scrim.remove(); document.removeEventListener("keydown", esc); };
  const esc = ev => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", esc);
  build(box, close);
  scrim.append(box); document.body.append(scrim);
  return close;
}
let toastEl = null, toastTimer = null;
function toast(msg, action){
  if (toastEl) toastEl.remove(); clearTimeout(toastTimer);
  toastEl = h("div", { class: "toast", role: "status" }, h("span", null, msg),
    action ? h("button", { type: "button", onclick: () => { if (toastEl){ toastEl.remove(); toastEl = null; } action.fn(); } }, action.label) : null);
  document.body.append(toastEl);
  toastTimer = setTimeout(() => { if (toastEl){ toastEl.remove(); toastEl = null; } }, action ? 6000 : 3500);
}

function wordHit(k, words, w){
  if (w.includes(" ")) return k.includes(w);
  if (w.length <= 2) return words.includes(w);
  if (w.length <= 4) return words.some(x => x.startsWith(w) || x.endsWith(w));
  return k.includes(w);
}
function guessCat(name, st){
  const k = keyOf(name); if (!k) return null;
  const catById = id => st.categories.find(c => c.id === id);
  const exact = st.memory.find(m => m.key === k);
  if (exact && catById(exact.category_id)) return exact.category_id;
  const pref = st.memory.find(m => m.key.length >= 3 && (k.startsWith(m.key + " ") || m.key.startsWith(k + " ")) && catById(m.category_id));
  if (pref) return pref.category_id;
  const words = k.split(" ");
  for (const [cname, list] of KEYWORDS){
    if (list.some(w => wordHit(k, words, w))) {
      const c = st.categories.find(c => c.name.toLowerCase() === cname.toLowerCase());
      if (c) return c.id;
    }
  }
  return null;
}

// lægger ens varer fra en eller flere opskrifter sammen ("3 spsk + 1 spsk olivenolie" -> "4 spsk")
const MASS = { g: 1, gr: 1, kg: 1000 }, VOL = { ml: 1, cl: 10, dl: 100, l: 1000 };
function sumQty(parts){
  let mass = 0, hasMass = false, vol = 0, hasVol = false;
  const other = new Map(), raw = [];
  for (const p of parts){
    if (p.raw){ raw.push(p.raw); continue; }
    const u = (p.unit.split(/\s+/)[0] || "").toLowerCase();
    if (p.b != null){ raw.push((fmt(p.a, p.unit).t + "-" + fmtStr(p.b, p.unit))); continue; }
    if (MASS[u] && p.unit.split(/\s+/).length === 1){ mass += p.a * MASS[u]; hasMass = true; }
    else if (VOL[u] && p.unit.split(/\s+/).length === 1){ vol += p.a * VOL[u]; hasVol = true; }
    else other.set(p.unit, (other.get(p.unit) || 0) + p.a);
  }
  const out = [];
  if (hasMass) out.push(fmtStr(mass, "g"));
  if (hasVol) out.push(vol < 100 ? fmtStr(vol, "ml") : vol < 1000 ? fmtStr(vol / 100, "dl") : fmtStr(vol / 1000, "l"));
  for (const [u, v] of other) out.push(fmtStr(v, u));
  return [...out, ...raw].join(" + ");
}
function buildItems(entries){
  const map = new Map();
  for (const { r, k } of entries){
    for (const i of (r.ingredienser || [])){
      if (!i.n) continue;
      const key = keyOf(i.n);
      if (!map.has(key)) map.set(key, { key, name: cap(i.n.trim()), parts: [], recipes: new Set() });
      const it = map.get(key);
      it.recipes.add(r.titel);
      const p = parseAmt(i.m);
      if (p) it.parts.push({ a: p.a * k, b: p.b != null ? p.b * k : null, unit: p.unit });
      else if (i.m) it.parts.push({ raw: i.m });
    }
  }
  return [...map.values()].map(it => Object.assign(it, { qty: sumQty(it.parts) }));
}
async function openShopFor(entries, hintText){
  let st;
  try { st = await indkobRpc("indkob_state"); }
  catch(e){ toast("Kunne ikke hente indkøbslisten. Tjek forbindelsen."); return; }
  const onList = new Set((st.items || []).filter(i => !i.checked).map(i => keyOf(i.name)));
  const multi = entries.length > 1;
  const rows = buildItems(entries).map(it => Object.assign(it, { on: onList.has(it.key), pick: false }));
  sheet((box, close) => {
    const listEl = h("div", { class: "pick-list" });
    const basisEl = h("div", { class: "pick-list" });
    const go = h("button", { class: "btn", type: "button" });
    let showBasis = false;
    const pickRow = r => h("button", { class: "pick" + (r.isBasis ? " basis" : ""), type: "button", role: "checkbox", "aria-checked": r.pick ? "true" : "false",
      onclick: () => { r.pick = !r.pick; draw(); } },
      h("span", { class: "box" }, r.pick ? "✓" : ""),
      h("span", { class: "pn" }, r.name, multi && r.recipes.size ? h("small", null, [...r.recipes].join(", ")) : null),
      r.on ? h("span", { class: "on" }, "på listen") : (r.qty ? h("span", { class: "pq" }, r.qty) : null));
    const toggle = h("button", { class: "link-btn", type: "button", onclick: () => { showBasis = !showBasis; draw(); } });
    // "Vælg alle" tager alt der ikke allerede står på listen (basisvarer kun hvis de er foldet ud)
    const selectable = () => rows.filter(r => !r.on && (!r.isBasis || showBasis));
    const allBtn = h("button", { class: "link-btn", type: "button", onclick: () => {
      const sel = selectable(), all = sel.length && sel.every(r => r.pick);
      sel.forEach(r => r.pick = !all); draw();
    } });
    const draw = () => {
      const bk = basisKeys();
      rows.forEach(r => r.isBasis = bk.has(r.key));
      listEl.textContent = ""; basisEl.textContent = "";
      const main = rows.filter(r => !r.isBasis), bas = rows.filter(r => r.isBasis);
      main.forEach(r => listEl.append(pickRow(r)));
      if (!main.length) listEl.append(h("p", { class: "hint" }, "Alt i opskriften er basisvarer."));
      toggle.classList.toggle("hidden", !bas.length);
      toggle.textContent = (showBasis ? "Skjul basisvarer" : "Vis basisvarer") + " (" + bas.length + ")";
      if (showBasis) bas.forEach(r => basisEl.append(pickRow(r)));
      const sel = selectable();
      allBtn.classList.toggle("hidden", !sel.length);
      allBtn.textContent = sel.length && sel.every(r => r.pick) ? "Fravælg alle" : "Vælg alle";
      const n = rows.filter(r => r.pick).length;
      go.disabled = n === 0;
      go.textContent = n === 0 ? "Vælg varer" : n === 1 ? "Tilføj 1 vare" : "Tilføj " + n + " varer";
    };
    go.addEventListener("click", async () => {
      const picked = rows.filter(r => r.pick); if (!picked.length) return;
      go.disabled = true; go.textContent = "Tilføjer…";
      let ok = 0;
      for (const r of picked){
        try {
          await indkobRpc("indkob_add", { p_name: r.name, p_qty: r.qty || null, p_note: "til " + [...r.recipes].join(", "), p_category: guessCat(r.name, st), p_by: me() });
          ok++;
        } catch(e){}
      }
      close();
      if (ok) pingIndkob();
      toast(ok === picked.length ? (ok === 1 ? "1 vare tilføjet til indkøb" : ok + " varer tilføjet til indkøb") : "Kun " + ok + " af " + picked.length + " blev tilføjet. Prøv igen.");
    });
    draw();
    box.append(h("div", { style: "display:flex;align-items:center;justify-content:space-between;gap:8px" }, h("h3", { style: "margin:0" }, "Hvad mangler du?"), allBtn),
      h("p", { class: "hint" }, hintText),
      listEl,
      h("div", { style: "display:flex;justify-content:space-between;gap:8px" }, toggle, h("button", { class: "link-btn", type: "button", onclick: () => basisSheet(draw) }, "Ret basisvarer")),
      basisEl,
      h("div", { class: "sheet-actions" }, h("button", { class: "btn ghost", type: "button", onclick: close }, "Luk"), go));
  });
}
$("shopBtn").addEventListener("click", () => {
  if (!current) return;
  openShopFor([{ r: current, k: factor() }], "Sæt flueben ved det, der skal på indkøbslisten." + (base ? " Mængder til " + serv + (base.label ? " " + base.label : "") + "." : ""));
});
function openPlanShop(){
  const entries = plan.map(p => {
    const r = byId(p.opskrift_id); if (!r) return null;
    const b = parseServ(r.portioner);
    return { r, k: b && p.antal ? p.antal / b.n : 1 };
  }).filter(Boolean);
  if (!entries.length) return;
  openShopFor(entries, "Alt fra ugeplanen (" + entries.map(e => e.r.titel).join(", ") + "). Ens varer er lagt sammen.");
}

/* ---------- wake lock ---------- */
let wakeLock = null, wantWake = store.get("opskrifter-wake") === "1";
async function applyWake(){
  const b = $("wakeBtn");
  if (wantWake && document.visibilityState === "visible"){
    try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    catch(e){ wantWake = false; toast("Skærmen kan ikke holdes tændt her."); }
  } else if (!wantWake && wakeLock){ try { await wakeLock.release(); } catch(e){} wakeLock = null; }
  b.setAttribute("aria-pressed", wantWake ? "true" : "false");
  b.title = wantWake ? "Skærmen holdes tændt" : "Hold skærmen tændt";
}
if ("wakeLock" in navigator){
  $("wakeBtn").classList.remove("hidden");
  $("wakeBtn").addEventListener("click", () => {
    wantWake = !wantWake; store.set("opskrifter-wake", wantWake ? "1" : "0");
    toast(wantWake ? "Skærmen holdes tændt, mens appen er åben" : "Skærmen må gå i dvale igen");
    applyWake();
  });
}

/* ---------- auto-opdatering ---------- */
// Henter siden uden cache, når appen åbnes, og genindlæser hvis der ligger en nyere version
const VERSION = "2026-11-08i";
async function checkUpdate(){
  try {
    const res = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    const m = (await res.text()).match(/const VERSION = "([^"]+)"/);
    if (m && m[1] !== VERSION) location.reload();
  } catch(e){}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
checkUpdate();

/* ---------- boot ---------- */
function boot(){
  renderTimers();
  if (!window.supabase) { $("sub").textContent = "Kunne ikke indlæse. Tjek forbindelsen og genindlæs."; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  load();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible"){ load(); renderTimers(); if (wantWake) applyWake(); }
  });
  if (wantWake) applyWake();
}
boot();
})();
